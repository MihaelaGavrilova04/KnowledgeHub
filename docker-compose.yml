services:
  db:
    image: postgres:16-alpine
    container_name: knowledge-db
    environment:
      POSTGRES_USER: ${DB_USERNAME}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
    ports:
      - "${DB_PORT}:5432"
    volumes:
      - knowledge-data:/var/lib/postgresql/data

  minio:
    image: minio/minio:latest
    container_name: knowledge-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY}
    ports:
      - "${MINIO_PORT}:9000"
      - "${MINIO_CONSOLE_PORT}:9001"
    volumes:
      - minio-data:/data

  createbuckets:
    image: minio/mc:latest
    depends_on:
      - minio
    environment:
      MC_HOST_local: http://${MINIO_ACCESS_KEY}:${MINIO_SECRET_KEY}@minio:9000
    entrypoint:
      - /bin/sh
      - -c
      - "until mc ls local/ > /dev/null 2>&1; do echo 'Waiting for MinIO...'; sleep 2; done && mc mb --ignore-existing local/digital-library && echo 'Bucket ready.'"

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: knowledge-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db

volumes:
  knowledge-data:
  minio-data:
  pgadmin_data: